logdir: 'stage_2_training_new_ckpt'
find_unused_parameters: True

model:
  base_learning_rate: 1.0e-5
  target: sgm.models.diffusion_modified.DiffusionEngine
  params:
    scale_factor: 0.18215
    disable_first_stage_autocast: True
    # ckpt_path: logs/stage_1_training/checkpoints/trainstep_checkpoints/enter_your_checkpoint_here.ckpt
    ckpt_path: logs/stage_1_training/checkpoints/epoch=00001-step=00025000.ckpt
    use_ema: False
    ema_decay_rate: 0.9999
    en_and_decode_n_samples_a_time: 2
    vision_encoder_lr_scale: 5
    pose_decoder_lr_scale: 5
    grad_config:
      train_vision_encoder: True
      train_pose_pred_net: True
      train_video_unet: False

    optimizer_config:
      target: torch.optim.Adam
      phase: stage_2

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.Denoiser
      params:
        scaling_config:
          target: sgm.modules.diffusionmodules.denoiser_scaling.VScalingWithEDMcNoise

    network_config:
      target: sgm.modules.diffusionmodules.video_model.VideoUNet
      params:
        adm_in_channels: 768
        num_classes: sequential
        use_checkpoint: True
        in_channels: 8
        out_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        spatial_transformer_attn_type: softmax-xformers
        extra_ff_mix_layer: True
        use_spatial_context: True
        merge_strategy: learned_with_images
        video_kernel_size: [3, 1, 1]
        pose_net_params:
          h_pose_indicies: [9, 13, 16, 19, 22]
          vision_encoder_output_channels: 420
          vision_encoder_scale_factor: 64
          frame_width: 256
          frame_height: 256
          action_dimension: 7

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
        - input_key: cond_frames_without_noise
          is_trainable: False
          ucg_rate: 0.1
          target: sgm.modules.encoders.modules.FrozenOpenCLIPImagePredictionEmbedder
          params:
            n_cond_frames: 1
            n_copies: 1
            open_clip_embedding_config:
              target: sgm.modules.encoders.modules.FrozenOpenCLIPImageEmbedder
              params:
                freeze: True

        - input_key: fps_id
          is_trainable: False
          target: sgm.modules.encoders.modules.ConcatTimestepEmbedderND
          params:
            outdim: 256

        - input_key: motion_bucket_id
          is_trainable: False
          target: sgm.modules.encoders.modules.ConcatTimestepEmbedderND
          params:
            outdim: 256

        - input_key: cond_frames
          is_trainable: False
          ucg_rate: 0.1
          target: sgm.modules.encoders.modules.VideoPredictionEmbedderWithEncoder
          params:
            disable_encoder_autocast: True
            en_and_decode_n_samples_a_time: 2
            n_cond_frames: 1
            n_copies: 1
            is_ae: True
            encoder_config:
              target: sgm.models.autoencoder.AutoencoderKLModeOnly
              params:
                embed_dim: 4
                monitor: val/rec_loss
                ddconfig:
                  attn_type: vanilla-xformers
                  double_z: True
                  z_channels: 4
                  resolution: 256
                  in_channels: 3
                  out_ch: 3
                  ch: 128
                  ch_mult: [1, 2, 4, 4]
                  num_res_blocks: 2
                  attn_resolutions: []
                  dropout: 0.0
                lossconfig:
                  target: torch.nn.Identity

        - input_key: cond_aug
          is_trainable: False
          target: sgm.modules.encoders.modules.ConcatTimestepEmbedderND
          params:
            outdim: 256

    # (not used during training)
    sampler_config:
      target: sgm.modules.diffusionmodules.sampling.EulerEDMSampler
      params:
        num_steps: 30

        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_max: 700.0

        guider_config:
          target: sgm.modules.diffusionmodules.guiders.LinearPredictionGuider
          params:
            num_frames: 25
            num_pose_frames: 36
            max_scale: 2.5
            min_scale: 1.0

    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss.StandardDiffusionLoss
      params:
        harmonize_sigmas: True  # Important for diffusion timestep consistency!
        # Analogous to "additional_model_inputs" in simple_video_sample.py
        batch2model_keys: ["image_only_indicator", "num_video_frames", "num_pose_frames"]

        # TODO(kylesargent): What is the right setting here?
        # Evidence:
        #   Appendix D.2:
        #     "...which can be recovered in the EDM framework [48] by setting σdata = 1)"
        loss_weighting_config:
          target: sgm.modules.diffusionmodules.loss_weighting.EDMWeighting
          params:
            sigma_data: 1.0

        # TODO(kylesargent): What is the right setting here?
        # Evidence:
        # Appendix D.4:
        #   " We train both models for 50k iterations at a batch size of 768, learning rate 
        #    3 × 10−5, and set Pmean = 1.0 and Pstd = 1.6. "
        sigma_sampler_config:
          target: sgm.modules.diffusionmodules.sigma_sampling.EDMSampling
          params:
            p_mean: 1.0
            p_std: 1.6

        use_action_loss: True

    first_stage_config:
      target: sgm.models.autoencoder.AutoencodingEngine
      params:
        loss_config:
          target: torch.nn.Identity
        regularizer_config:
          target: sgm.modules.autoencoding.regularizers.DiagonalGaussianRegularizer
        encoder_config: 
          target: sgm.modules.diffusionmodules.model.Encoder
          params:
            attn_type: vanilla
            double_z: True
            z_channels: 4
            resolution: 256
            in_channels: 3
            out_ch: 3
            ch: 128
            ch_mult: [1, 2, 4, 4]
            num_res_blocks: 2
            attn_resolutions: []
            dropout: 0.0
        decoder_config:
          target: sgm.modules.autoencoding.temporal_ae.VideoDecoder
          params:
            attn_type: vanilla
            double_z: True
            z_channels: 4
            resolution: 256
            in_channels: 3
            out_ch: 3
            ch: 128
            ch_mult: [1, 2, 4, 4]
            num_res_blocks: 2
            attn_resolutions: []
            dropout: 0.0
            video_kernel_size: [3, 1, 1]

data:
  target: sgm.data.video_modified.VideoDatasetModule
  params:
    n_frames: 26
    cond_aug: 0.02
    motion_bucket_id: 100
    fps_id: 6
    frame_width: 256
    frame_height: 256
    tasks:
      LIVING_ROOM_SCENE2_put_both_the_alphabet_soup_and_the_tomato_sauce_in_the_basket_demo: null
      LIVING_ROOM_SCENE2_put_both_the_cream_cheese_box_and_the_butter_in_the_basket_demo: null
      KITCHEN_SCENE3_turn_on_the_stove_and_put_the_moka_pot_on_it_demo: null
      KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it_demo: null
      LIVING_ROOM_SCENE5_put_the_white_mug_on_the_left_plate_and_put_the_yellow_and_white_mug_on_the_right_plate_demo: null
      STUDY_SCENE1_pick_up_the_book_and_place_it_in_the_back_compartment_of_the_caddy_demo: null
      LIVING_ROOM_SCENE6_put_the_white_mug_on_the_plate_and_put_the_chocolate_pudding_to_the_right_of_the_plate_demo: null
      LIVING_ROOM_SCENE1_put_both_the_alphabet_soup_and_the_cream_cheese_box_in_the_basket_demo: null
      KITCHEN_SCENE8_put_both_moka_pots_on_the_stove_demo: null
      KITCHEN_SCENE6_put_the_yellow_and_white_mug_in_the_microwave_and_close_it_demo: null
    skip_demos: {}
    sample_fps: 10
    video_fps: 30
    pred_horizon: 12
    aug:
      brightness: 0.2
      contrast: 0.2
      saturation_rgb: 0.2
      hue_rgb: 0.05
    action_dim: 7
    swap_rgb: False
    mode: 'train'
    batch_size: 4
    num_workers: 8
    shuffle: True

lightning:
  modelcheckpoint:
    # this is saved supposedly taking metrics into account (see main.py)
    params:
      every_n_train_steps: 5000
      save_last: False
      save_top_k: -1

  callbacks:
    metrics_over_trainsteps_checkpoint:
      # this is saved always without deleting, but weights only so smaller (see main.py)
      params:
        every_n_epochs: 1

    image_logger:
      target: main.ImageLogger
      params:
        disabled: False
        enable_autocast: False
        batch_frequency: 1000000000
        max_images: 8
        increase_log_steps: False
        log_first_step: True
        log_train: True
        log_images_kwargs:
          use_ema_scope: False
          N: 8
          n_rows: 2

  trainer:
    devices: 0,1
    precision: 16-mixed
    benchmark: True
    num_sanity_val_steps: 0
    accumulate_grad_batches: 1
    val_check_interval: 2
    limit_val_batches: 0.0  # effectively disables val_check_interval
    max_epochs: 100
    log_every_n_steps: 1

