    aug:
      brightness: 0.2
      contrast: 0.2
      saturation_rgb: 0.2
      hue_rgb: 0.05
    action_dim: 7
    swap_rgb: false
    mode: test
    task_suite_name: libero_90
decoding_t: 25
log_folder: example_inference_libero_90_zeroshot_original_gpu1
number_of_experiments: 50
max_traj_len: 500
action_horizon: 16
